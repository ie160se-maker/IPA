<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPA【極】マスターガイド</title>
  <meta name="description" content="IPAの母音・子音をカテゴリー別に学べる発音ガイドです。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body class="is-locked">
  <!-- ===== パスワードゲート（追記ここから） ===== -->
  <div class="gate-screen" id="gateScreen" aria-labelledby="gateTitle">
    <div class="gate-backdrop"></div>
    <div class="gate-card">
      <div class="gate-eyebrow">PRIVATE ACCESS</div>
      <h1 id="gateTitle">IPA【極】完全マスターガイド</h1>
      <p class="gate-copy">
        この教材ページはパスワード保護されています。閲覧するには、指定のアクセスコードを入力してください。
      </p>
      <form class="gate-form" id="gateForm" novalidate>
        <label class="gate-label" for="passwordInput">パスワード</label>
        <input
          class="gate-input"
          id="passwordInput"
          name="password"
          type="password"
          placeholder="アクセスコードを入力"
          autocomplete="current-password"
          required
        />
        <button class="gate-button" type="submit">IPA画面に入る</button>
        <p class="gate-error" id="gateError" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>
  <!-- ===== パスワードゲート（追記ここまで） ===== -->

  <div class="site-shell" id="siteShell" aria-hidden="true">

  <header class="hero">
    <div class="wrap">
      <div class="hero-card">
        <div class="eyebrow">IPA PRONUNCIATION LIBRARY</div>
        <h1><span class="accent">IPA【極】</span>完全マスターガイド</h1>
        <p class="hero-copy">
          母音・子音を資料のカテゴリーに沿って整理した、発音学習サイトです。
        </p>
        <div class="hero-meta">
          <span>単一母音 / 二重母音 / 重要母音</span>
          <span>破裂音 / 鼻音 / 破擦音 / 摩擦音 / 接近音 / 側面接近音 / 重要子音</span>
        </div>
      </div>
    </div>
  </header>

  <nav class="sticky-nav" aria-label="セクションナビゲーション">
    <div class="wrap nav-inner" id="quickNav"></div>
  </nav>
    
  <main class="wrap main-content">
    <div id="sectionsRoot"></div>
  </main>

  </div><!-- /.site-shell（追記） -->
  <script src="./assets/js/ipa-data.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
